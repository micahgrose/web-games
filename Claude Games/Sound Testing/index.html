<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SOUND TESTING — creak lab</title>
<style>
  :root { color-scheme: dark; }
  body { background: #0b0d12; color: #cdd2de; font-family: Georgia, serif; margin: 0;
         padding: 28px clamp(16px, 5vw, 64px); line-height: 1.5; }
  h1 { color: #ffdca8; letter-spacing: 5px; font-weight: normal; margin: 0 0 4px; font-size: 26px; }
  .sub { color: #6d7488; font-style: italic; margin: 0 0 24px; max-width: 70ch; }
  h2 { color: #b8925a; font-weight: normal; font-size: 15px; letter-spacing: 3px;
       border-bottom: 1px solid #262c3d; padding-bottom: 6px; margin: 34px 0 14px; }
  .cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .card { background: #12161f; border: 1px solid #262c3d; padding: 16px 18px; }
  .card h3 { margin: 0 0 8px; font-size: 17px; color: #e6d5ae; font-weight: normal; letter-spacing: 1px; }
  .card p { margin: 0 0 14px; font-size: 14px; color: #8b93a8; }
  button { background: #1c2233; color: #e6d5ae; border: 1px solid #3a4258; padding: 10px 18px;
    font-family: inherit; font-size: 15px; cursor: pointer; letter-spacing: 1px; }
  button:hover { border-color: #c9a45c; color: #ffdca8; }
  button:active { background: #3a3222; }
  .big { width: 100%; padding: 14px; font-size: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
  .knob { color: #6d7488; font-size: 13px; }
  input[type=range] { vertical-align: middle; accent-color: #c9a45c; }
  code { color: #9fb0d0; }
</style>
</head>
<body>
<h1>CREAK LAB</h1>
<p class="sub">Candidates differ by MECHANISM, not by parameter. Click one, then tell me which is closest and
<em>why</em> — "too buzzy", "too regular", "sounds like a synth sweep", "the end is wrong". Vocabulary matters more
than a ranking; a ranking tells me which, a reason tells me what.</p>

<div class="row">
  <span class="knob">gain <input type="range" id="gain" min="0" max="100" value="75"></span>
  <button id="seq">Play all in sequence</button>
  <button id="rep">Repeat last ×3</button>
</div>

<div id="rounds"></div>

<script src="js/creaks.js"></script>
<script>
  var ctx = null, master = null, lab = null, last = null;
  function ensure() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      var comp = ctx.createDynamicsCompressor();
      master.connect(comp); comp.connect(ctx.destination);
      lab = Creaks.Lab(ctx, master);
    }
    if (ctx.state === 'suspended') ctx.resume();
    master.gain.value = +document.getElementById('gain').value / 100;
  }
  function play(id, at) { ensure(); last = id; lab[id](1, at || 0); }

  var rounds = {};
  Creaks.CATALOG.forEach(function (c) { (rounds[c.round] = rounds[c.round] || []).push(c); });
  var host = document.getElementById('rounds');
  Object.keys(rounds).sort().forEach(function (r) {
    var h = document.createElement('h2');
    h.textContent = 'ROUND ' + r;
    host.appendChild(h);
    var grid = document.createElement('div'); grid.className = 'cards';
    rounds[r].forEach(function (c) {
      var card = document.createElement('div'); card.className = 'card';
      var t = document.createElement('h3'); t.textContent = c.label;
      var p = document.createElement('p'); p.textContent = c.blurb;
      var b = document.createElement('button'); b.className = 'big';
      b.textContent = '▶  play  (' + c.dur.toFixed(2) + 's)';
      b.onclick = function () { play(c.id); };
      card.appendChild(t); card.appendChild(p); card.appendChild(b);
      grid.appendChild(card);
    });
    host.appendChild(grid);
  });

  document.getElementById('seq').onclick = function () {
    ensure();
    var at = 0;
    Creaks.CATALOG.forEach(function (c) { play(c.id, at); at += c.dur + 0.55; });
  };
  document.getElementById('rep').onclick = function () {
    if (!last) return;
    ensure();
    var c = Creaks.CATALOG.filter(function (x) { return x.id === last; })[0];
    for (var i = 0; i < 3; i++) play(last, i * (c.dur + 0.4));
  };
</script>
</body>
</html>
